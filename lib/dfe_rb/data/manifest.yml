    source: Portal Nacional da NF-e, Notas Técnicas
    sha256: d62445d7429806b0403b44818e252fea16107794319a029ac7025017e5f4e34c
    attachments:
      - {file: NT_2025.002_v1.51_RTC.pdf, sha256: a4aaaa181522b43cd90b502f8ccb9e4bdabea30fed838e2d0790be5ba77254a4}
    note: >-
      The rules were read at v1.51 and checked against v1.53 (SHA-256 above, read in full
      for UB12-10, B25-40 and the VC and 3BA02 groups). v1.52 and v1.53 changed UB12-10,
      VC02-14 to VC02-50, VC03-20, 3BA02-50 to 3BA02-68 and B25-40: a return references its
      note in the header (one key) or on its items, never both. Checked here, from the days
      the NT dates them (ReferenceRules): B25-40 (255), VC02-05 and VC02-14 (1010, 321),
      VC02-30 (1130), VC02-40 (1193) and UB12-10's exception 1, which reads the referenced
      key's AAMM. VC02-20 (1072) is written but waits for a date ("implementação futura").
      Left to SEFAZ: 3BA02-50 to 3BA02-68 (the referenced notes' totals), VC02-50 (the
      referenced note's direction) and VC03-20 (nItem; "implementação futura", with no
      exception yet for the return whose nItem v1.53 made optional). UB12-10 still has no
      production date ("implementação futura").
    issue: https://github.com/higajooj/dfe_rb/issues/16
