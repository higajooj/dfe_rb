# Every official document dfe_rb follows, one row each (see CONTRIBUTING.md).
#
#   id              a stable key
#   document        its name as published
#   kind            moc, nt, it, schema, table (a table published outside an NT or IT), law, guide, certificate
#   status          implemented; pending: published and not followed yet (note says what's left);
#                   out_of_scope: published, but about something the gem doesn't do (note says why)
#   dfe             what it touches: nfe, nfce, mdfe, nfse, events, distribution, ibs_cbs, efd
#   version         the version the gem follows
#   current         the newest version published, when the gem follows an older one
#   published       publication, as the document dates it (yyyy-mm or yyyy-mm-dd); null if it doesn't
#   production      production start of that version, as its schedule gives it; null if it gives none
#   implemented_in  the files that follow it
#   tables, schemas the shipped tables and schema packages copied from it (a spec checks each has a row)
#   source          where it's published
#   sha256          SHA-256 of the PDF, ZIP or XLSX read (attachments: other files of the same
#                   version); null when no such file was kept (a page, an API, a folder copy)
#   note            anything a reader of the row needs
#   issue           the GitHub issue tracking what's left
#
# Checked against the Portal Nacional da NF-e, the SVRS portals and the MDF-e portal and gov.br/nfse on 2026-11-18.

