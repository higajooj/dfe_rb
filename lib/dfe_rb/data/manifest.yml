# What the gem is waiting for: announced, or left open by a published document, but not yet law.
awaiting:
  - what: Homologação evidence that a state's consultation page reads an off-line QR code's raw Base64 signature (`+`, `/`, `=`) as signed (MS at least, then the states clients use)
    affects: Nfce::QrCode.offline
    source: NT 2026.003 §4.3.2 prints it raw but says nothing of how the page decodes the query (issue 4)
  - what: The production date of RV UB12-10 (rej. 1115, IBSCBS missing on a regime normal note)
    affects: Validator::IBS_CBS_SINCE
    source: NT 2025.002 v1.53, UB12-10 Observação 2 ("implementação futura para produção")
  - what: The IBS/CBS rules for the Simples Nacional and the MEI (CRT 1, 2, 4), taxed from 2027
    affects: Validator#check_ibs_cbs, Calculator
    source: NT 2025.002 v1.53 ("serão publicadas em NT futura"); NT 2026.005 brings them (issue 12)
  - what: The 2027 and 2028 CBS rates, and every rate from 2029
    affects: Rates::IBS_CBS
    source: IT 2025.002 v1.71 §05 ("Aguardar Legislação")
  - what: The date of RV VC02-20 (rej. 1072, the same key and item referenced twice; "implementação futura", for both environments)
    affects: ReferenceRules::DUPLICATE_ITEM_REFERENCE_SINCE
    source: NT 2025.002 v1.53, VC02-20 Observação 2 (issue 16)
  - what: RV VC03-20 (rej. 1048, nItem of DFeReferenciado required; "implementação futura") and the exception for a return, whose nItem v1.53 made optional
    affects: ReferenceRules
    source: NT 2025.002 v1.53, VC03-20 and the version table (issue 16)
  - what: The day each cCredPres starts for each tax (all in 2027 or 2029; cCredPres 08's IBS start is blank on the SVRS page)
    affects: Tables::PresumedCredit#valid_on?
    source: IT 2025.002 v1.71 cCredPres table
  - what: The EFD ICMS/IPI leiaute 021, in force from 2027
    affects: Efd::IcmsIpi::Version
    source: Nota Técnica 2026.001 of the EFD ICMS/IPI
  - what: The start dates for mandatory issue of each document under the IBS/CBS regulations
    affects: nothing yet (read the act)
    source: Ato Conjunto RFB/CGIBS nº 7, de 11/11/2026, amending Ato Conjunto nº 4, de 30/07/2026 (Portal informe of 2026-11-13)
