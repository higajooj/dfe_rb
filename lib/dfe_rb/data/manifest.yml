    production: "2026-11-11"
    implemented_in: [lib/dfe_rb/nfe/validator.rb, lib/dfe_rb/nfce/validator.rb, lib/dfe_rb/nfe/retirements.rb, lib/dfe_rb/nfe/client.rb, lib/dfe_rb/nfe/status_codes.rb, lib/dfe_rb/deprecation.rb]
    source: Portal Nacional da NF-e, Notas Técnicas
    sha256: e375b487fdb38c0f114dbc9fd4a0b109151d0a21e1770d738f5c5f9597758202
    note: >-
      v1.02 (read in full) switches off inutilização in AC, BA and SP (Ajustes SINIEF 38/2026 and 40/2026;
      RV I01a, rej. 998 or HTTP 404; homologação and production 2026-11-11), which Nfe::Client#inutilize
      refuses locally (Retirements), and ends asynchronous authorization for the NF-e and the NFC-e (RV GAP03a-6,
      rej. 129; homologação 2027-02-01, production 2027-04-05), which Nfe::Client#authorize refuses locally from
      those days after warning until then (Deprecation). Left to SEFAZ: RV 1C17-38 now covers models 55 and 65
      (rej. 781, the issuer's registration status), the database check 3B08-100 skips AC, BA and SP, and the
      document's other rules (B26-30, B26-50, C02a, G04e, G06, G08) read as in v1.01, the text transcribed in the
      legislation library. Its schema change against invalid characters names no package.
