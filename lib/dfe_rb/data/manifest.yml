  - what: An issue-to-cancellation lifecycle in produção restrita with an issuer registered in a municipality of the national issuer. On 18/11/2026 the DPS and the event passed the schema and the signature (RSA-SHA256) and stopped at the registers (E0084, E1831), and Sidrolândia, the registered MS issuer's city, has no national issuer there
    affects: Nfse::Client
    source: spec/live/nfse_homologacao_spec.rb
  - what: Homologação evidence that a state's consultation page reads an off-line QR code's raw Base64 signature (`+`, `/`, `=`) as signed, at a state whose page checks it. MS (16/11/2026) shows the note from the raw, the percent-encoded and a tampered signature alike, so its page doesn't check the signature and proves nothing either way
    affects: Nfce::QrCode.offline
    source: NT 2026.003 §4.3.2 prints it raw but says nothing of how the page decodes the query (issue 4)
